services:
  app:
    build: .
    container_name: url_shortener_app
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: url_shortener_redis
    ports:
      - "6379:6379"
    restart: unless-stopped